openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ownerRead
    description: Private, bounded owner read projections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /owner/v1:
    get:
      operationId: getOwnerReadView
      tags: [ownerRead]
      summary: Read a bounded owner projection
      security:
        - OwnerBearerAuth: []
      parameters:
        - name: view
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OwnerReadView"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: A stable page from one projection generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerReadPage"
        "400":
          $ref: "#/components/responses/OwnerReadError"
        "401":
          $ref: "#/components/responses/OwnerReadError"
        "403":
          $ref: "#/components/responses/OwnerReadError"
        "404":
          $ref: "#/components/responses/OwnerReadError"
        "409":
          $ref: "#/components/responses/OwnerReadError"
        "503":
          $ref: "#/components/responses/OwnerReadError"
  /owner/v1/export:
    get:
      operationId: exportOwnerReadView
      tags: [ownerRead]
      summary: Export one complete bounded owner projection
      security:
        - OwnerBearerAuth: []
      parameters:
        - name: view
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OwnerReadView"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Complete export within the configured item and byte limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerReadPage"
        "400":
          $ref: "#/components/responses/OwnerReadError"
        "401":
          $ref: "#/components/responses/OwnerReadError"
        "403":
          $ref: "#/components/responses/OwnerReadError"
        "404":
          $ref: "#/components/responses/OwnerReadError"
        "413":
          $ref: "#/components/responses/OwnerReadError"
        "503":
          $ref: "#/components/responses/OwnerReadError"
  /owner/v1/evidence/detail:
    get:
      operationId: getOwnerEvidenceDetail
      tags: [ownerRead]
      summary: Read one owner-visible evidence detail record
      security:
        - OwnerBearerAuth: []
      parameters:
        - name: item_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
      responses:
        "200":
          description: Evidence detail from the current evidence projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerEvidenceDetail"
        "400":
          $ref: "#/components/responses/OwnerReadError"
        "401":
          $ref: "#/components/responses/OwnerReadError"
        "403":
          $ref: "#/components/responses/OwnerReadError"
        "404":
          $ref: "#/components/responses/OwnerReadError"
        "503":
          $ref: "#/components/responses/OwnerReadError"
  /owner/v1/diagnostics:
    get:
      operationId: getOwnerReadDiagnostics
      tags: [ownerRead]
      summary: Read private projection freshness diagnostics
      security:
        - OwnerBearerAuth: []
      responses:
        "200":
          description: Bounded projection sequence and lag by owner view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerReadDiagnostics"
        "401":
          $ref: "#/components/responses/OwnerReadError"
        "403":
          $ref: "#/components/responses/OwnerReadError"
        "503":
          $ref: "#/components/responses/OwnerReadError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OwnerReadView:
      type: string
      enum:
        - today
        - predictions
        - validation
        - models
        - system
        - positions
        - alerts
        - reports
        - evidence
    OwnerReadSourceRef:
      type: object
      additionalProperties: false
      required: [target_schema_name, target_id]
      properties:
        target_schema_name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^qc2\\.[A-Za-z0-9_.-]+\\.v[1-9][0-9]*$"
        target_id:
          type: string
          minLength: 1
          maxLength: 128
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    OwnerReadPayload:
      oneOf:
        - $ref: "../../packages/owner_api/schemas/v1/OwnerTodayPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerPredictionsPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerValidationPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerModelsPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerSystemPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerPositionsPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerAlertsPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerReportsPayload.schema.json"
        - $ref: "../../packages/owner_api/schemas/v1/OwnerEvidencePayload.schema.json"
    OwnerReadItem:
      type: object
      additionalProperties: false
      required:
        - item_id
        - sort_key
        - source_sequence
        - source_ref
        - payload
        - receipt_hash
      properties:
        item_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        sort_key:
          type: string
          maxLength: 256
          pattern: "^[\\x20-\\x7E]*$"
        source_sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        source_ref:
          $ref: "#/components/schemas/OwnerReadSourceRef"
        payload:
          $ref: "#/components/schemas/OwnerReadPayload"
        receipt_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    OwnerReadPage:
      type: object
      additionalProperties: false
      required:
        - schema_name
        - schema_version
        - environment_namespace
        - view_name
        - projection_sequence
        - source_sequence
        - source_highwater_sequence
        - lag
        - stale
        - data_state
        - built_at
        - freshness_deadline
        - source_refs
        - items
        - next_cursor
      properties:
        schema_name:
          const: qc2.owner_api.OwnerReadPage.v1
        schema_version:
          const: "1.0"
        environment_namespace:
          type: string
          enum: [development, test, research, production]
        view_name:
          $ref: "#/components/schemas/OwnerReadView"
        projection_sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        source_sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        source_highwater_sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        lag:
          type: integer
          minimum: 0
        stale:
          type: boolean
        data_state:
          type: string
          enum: [CURRENT, STALE, EMPTY]
        built_at:
          type: string
          format: date-time
        freshness_deadline:
          type: string
          format: date-time
        source_refs:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/OwnerReadSourceRef"
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/OwnerReadItem"
        next_cursor:
          type: [string, "null"]
          maxLength: 2048
    OwnerEvidenceDetail:
      type: object
      additionalProperties: false
      required:
        - schema_name
        - schema_version
        - environment_namespace
        - projection_sequence
        - item
      properties:
        schema_name:
          const: qc2.owner_api.OwnerEvidenceDetail.v1
        schema_version:
          const: "1.0"
        environment_namespace:
          type: string
          enum: [development, test, research, production]
        projection_sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        item:
          $ref: "#/components/schemas/OwnerReadItem"
    OwnerReadDiagnosticsView:
      type: object
      additionalProperties: false
      required:
        - view_name
        - projection_sequence
        - source_sequence
        - source_highwater_sequence
        - lag
        - stale
        - built_at
      properties:
        view_name:
          $ref: "#/components/schemas/OwnerReadView"
        projection_sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        source_sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        source_highwater_sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        lag:
          type: integer
          minimum: 0
        stale:
          type: boolean
        built_at:
          type: [string, "null"]
          format: date-time
    OwnerReadDiagnostics:
      type: object
      additionalProperties: false
      required: [schema_name, environment_namespace, views]
      properties:
        schema_name:
          const: qc2.owner_api.OwnerReadDiagnostics.v1
        environment_namespace:
          type: string
          enum: [development, test, research, production]
        views:
          type: array
          minItems: 9
          maxItems: 9
          items:
            $ref: "#/components/schemas/OwnerReadDiagnosticsView"
    OwnerReadError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 96
            message:
              type: string
              minLength: 1
              maxLength: 256
  responses:
    OwnerReadError:
      description: Redacted owner API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OwnerReadError"
  securitySchemes:
    OwnerBearerAuth:
      type: http
      scheme: bearer

