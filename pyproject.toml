[project]
name = "quantracore-apex-gen2-bootstrap"
version = "0.0.0"
requires-python = "==3.13.11"
dependencies = [
    "jsonschema==4.25.1",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
required-version = "==0.9.24"
package = false
